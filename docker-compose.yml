services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flatsadmin
      POSTGRES_USER: flatsadmin
      POSTGRES_PASSWORD: flatsadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://flatsadmin:flatsadmin@postgres:5432/flatsadmin
      POSTGRES_DB: flatsadmin
      POSTGRES_USER: flatsadmin
      POSTGRES_PASSWORD: flatsadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: dev-secret-change-me-change-me-change-me
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8080,http://localhost:4200
      DEFAULT_LOCALE: el
    ports:
      - "8001:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "8081:4200"

volumes:
  postgres_data:
  frontend_node_modules:
