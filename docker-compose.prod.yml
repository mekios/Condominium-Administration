services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flatsadmin}
      POSTGRES_USER: ${POSTGRES_USER:-flatsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_DJANGO_STARTUP: "1"
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://postgres/flatsadmin
      POSTGRES_DB: ${POSTGRES_DB:-flatsadmin}
      POSTGRES_USER: ${POSTGRES_USER:-flatsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
