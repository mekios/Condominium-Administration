# Production stack. Host nginx terminates TLS and proxies:
#   https://metamorfoseos5.site/         -> 127.0.0.1:3000
#   https://metamorfoseos5.site/api/     -> 127.0.0.1:8000
#   https://metamorfoseos5.site/admin/   -> 127.0.0.1:8000
#   https://metamorfoseos5.site/static/  -> 127.0.0.1:8000
# Deploy: ./deploy-production.sh

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flatsadmin}
      POSTGRES_USER: ${POSTGRES_USER:-flatsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RUN_DJANGO_STARTUP: "1"
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://postgres/flatsadmin
      POSTGRES_DB: ${POSTGRES_DB:-flatsadmin}
      POSTGRES_USER: ${POSTGRES_USER:-flatsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
