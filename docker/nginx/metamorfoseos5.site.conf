# metamorfoseos5.site — host Nginx (production)
#
# Install:
#   sudo cp docker/nginx/metamorfoseos5.site.conf /etc/nginx/sites-available/metamorfoseos5.site
#   sudo ln -sf /etc/nginx/sites-available/metamorfoseos5.site /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# Before SSL: use metamorfoseos5.site.http.conf, then:
#   sudo certbot --nginx -d metamorfoseos5.site -d www.metamorfoseos5.site
#   sudo cp docker/nginx/metamorfoseos5.site.conf /etc/nginx/sites-available/metamorfoseos5.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker (docker-compose.prod.yml):
#   frontend -> 127.0.0.1:3000
#   backend  -> 127.0.0.1:8000

server {
    listen 80;
    listen [::]:80;
    server_name metamorfoseos5.site www.metamorfoseos5.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metamorfoseos5.site www.metamorfoseos5.site;

    ssl_certificate     /etc/letsencrypt/live/metamorfoseos5.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metamorfoseos5.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|woff2|png|svg|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
